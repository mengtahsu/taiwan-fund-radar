name: Update data and deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Early gate-only attempts compensate for GitHub scheduler delays of up to 2.5 hours.
    - cron: "25 1,9,17 * * *"
      timezone: Asia/Taipei
    - cron: "55 1,9,17 * * *"
      timezone: Asia/Taipei
    - cron: "25 2,10,18 * * *"
      timezone: Asia/Taipei
    - cron: "55 2,10,18 * * *"
      timezone: Asia/Taipei
    - cron: "25 3,11,19 * * *"
      timezone: Asia/Taipei
    - cron: "55 3,11,19 * * *"
      timezone: Asia/Taipei

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FUND_SOURCE_URL: ${{ secrets.FUND_SOURCE_URL || vars.FUND_SOURCE_URL }}
      FUND_SOURCE_NAME: ${{ vars.FUND_SOURCE_NAME || '基金資料來源' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether this attempt should update
        id: schedule_gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/scheduled-update-gate.py

      - name: Configure Pages
        if: steps.schedule_gate.outputs.should_update == 'true'
        uses: actions/configure-pages@v5

      - name: Restore update caches
        if: steps.schedule_gate.outputs.should_update == 'true'
        uses: actions/cache@v4
        with:
          path: |
            data/nav_cache.json
            data/monthly_nav.json
            data/fundrich_cache.json
            data/margin.json
            data/twii_history.json
          key: update-caches-${{ github.run_id }}
          restore-keys: |
            update-caches-

      - name: Create source config
        if: steps.schedule_gate.outputs.should_update == 'true' && env.FUND_SOURCE_URL != ''
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("config").mkdir(exist_ok=True)
          Path("config/source.json").write_text(
              json.dumps(
                  {
                      "sourceName": os.environ["FUND_SOURCE_NAME"],
                      "sourceUrl": os.environ["FUND_SOURCE_URL"],
                      "outputPath": "data/funds.json",
                      "intervalHours": 8,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Update fund data
        if: steps.schedule_gate.outputs.should_update == 'true' && env.FUND_SOURCE_URL != ''
        run: python3 update_funds.py --config config/source.json --once

      - name: Update Taiwan fund data with channel links
        if: steps.schedule_gate.outputs.should_update == 'true' && env.FUND_SOURCE_URL == ''
        run: timeout 6m python3 update_funds.py --provider combined-tw-funds --once || echo "Fund update timed out or failed; deploying committed data/funds.json"

      - name: Update market data
        if: steps.schedule_gate.outputs.should_update == 'true'
        run: timeout 1m python3 update_funds.py --provider markets --once || echo "Market update timed out or failed; deploying committed data/markets.json if present"

      - name: Update margin data
        if: steps.schedule_gate.outputs.should_update == 'true'
        run: timeout 3m python3 update_funds.py --provider margin --once || echo "Margin update timed out or failed; deploying committed data/margin.json if present"

      - name: Update TWII moving-average history
        if: steps.schedule_gate.outputs.should_update == 'true'
        run: timeout 1m python3 update_funds.py --provider twii-history --once || echo "TWII history update timed out or failed; deploying committed data/twii_history.json if present"

      - name: Run sanity checks
        if: steps.schedule_gate.outputs.should_update == 'true'
        run: |
          set +e
          sanity_output=$(node scripts/fund-box-test.mjs 2>&1 && node scripts/sanity-check.mjs 2>&1)
          sanity_status=$?
          echo "$sanity_output"
          {
            echo "### Sanity check"
            echo '```text'
            echo "$sanity_output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$sanity_status"

      - name: Upload Pages artifact
        if: steps.schedule_gate.outputs.should_update == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.schedule_gate.outputs.should_update == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
